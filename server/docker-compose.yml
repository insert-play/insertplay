# InsertPlay remote library server: Caddy serving the library read-only, plus the
# indexer as a one-shot service. Setup in README.md; contract in docs/remote-library.md.
#
# Variables (put them in server/.env, which is not in git; see .env.example):
#   INSERTPLAY_LIBRARY  library root, one InsertPlay card per folder (mounted read-only)
#   INSERTPLAY_CONFIG   server config folder, outside the library disk: holds token.env
#                       (mode 0600) and index/ (written by the indexer)
#   INSERTPLAY_PORT     host port (default 8080)
#   INSERTPLAY_UID/GID  owner of the files the indexer writes (default 1000)

x-library: &library
  type: bind
  source: ${INSERTPLAY_LIBRARY:?set INSERTPLAY_LIBRARY in server/.env}
  target: /srv/library
  read_only: true
  bind:
    # Fail instead of creating an empty folder when the disk is not mounted.
    create_host_path: false

services:
  caddy:
    image: caddy:2
    # "always", not "unless-stopped": docker.io 20.10.5 (Debian 11) marks the container as
    # manually stopped at shutdown and does not bring an unless-stopped one back after a reboot.
    restart: always
    ports:
      - "${INSERTPLAY_PORT:-8080}:8080"
    env_file:
      - ${INSERTPLAY_CONFIG:?set INSERTPLAY_CONFIG in server/.env}/token.env
    # Refuse to serve without a real token: an empty one would accept "Bearer ".
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$${#INSERTPLAY_TOKEN}" -lt 32 ]; then
          echo "INSERTPLAY_TOKEN missing or shorter than 32 characters in token.env" >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - <<: *library
      - type: bind
        source: ${INSERTPLAY_CONFIG}/index
        target: /srv/index
        read_only: true
        bind:
          create_host_path: false
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-shot: docker compose run --rm indexer
  indexer:
    image: python:3.12-alpine
    profiles: ["tools"]
    user: "${INSERTPLAY_UID:-1000}:${INSERTPLAY_GID:-1000}"
    command: ["python3", "-I", "/opt/indexer/remote_library_index.py", "/srv/library", "/srv/index"]
    volumes:
      - <<: *library
      - type: bind
        source: ${INSERTPLAY_CONFIG}/index
        target: /srv/index
        bind:
          create_host_path: false
      - ./indexer:/opt/indexer:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
